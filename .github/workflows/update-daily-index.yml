name: Update daily inventory index

on:
  push:
    branches: [main]
    paths:
      - '[0-9][0-9][0-9][0-9]/*.md'
  workflow_dispatch:
  schedule:
    - cron: '5 15 * * *' # 00:05 Japan time; also switches the visible current year.

permissions:
  contents: write

concurrency:
  group: daily-inventory-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true
      - name: Refresh and publish index
        run: |
          git pull --ff-only origin main
          python3 scripts/update_index.py
          git add README.md
          if git diff --cached --quiet; then
            echo 'Index is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update daily inventory index'
          git push origin main
